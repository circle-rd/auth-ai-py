name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and the development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[starlette]" --group dev

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy

      - name: Unit tests with the coverage threshold
        run: pytest --cov --cov-report=term-missing

  # Newer interpreters are watched, not enforced: a wheel missing for a dependency
  # must not block a release.
  upcoming:
    name: Test on Python ${{ matrix.python }} (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install the package and the development tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[starlette]" --group dev

      - name: Unit tests
        run: pytest

  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Import the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import auth_ai, auth_ai.server, auth_ai.web; print(auth_ai.__version__)"

  audit:
    name: Audit runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The vulnerabilities pip-audit found came from the pip bundled with the
      # runner's Python, not from what the package ships: audit a current pip.
      - name: Audit
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/python -m pip install --upgrade pip
          /tmp/audit/bin/pip install . pip-audit
          /tmp/audit/bin/pip-audit --skip-editable
