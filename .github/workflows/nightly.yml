name: Nightly — PyPI (pre-release)

# Manual: run it from the branch to publish (develop, or main). The version
# exists only in this workspace: nothing is committed back. A nightly is a PEP 440
# developmental release, which pip only installs with `--pre`.
on:
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  build:
    name: Build the nightly distributions
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Only develop and main may be published
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            develop | main) ;;
            *) echo "::error::Run this workflow from develop or main, not '${REF_NAME}'."; exit 1 ;;
          esac

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A nightly of an already released version would sort before it
      # (0.1.0.dev1 < 0.1.0): it is numbered after the next patch instead.
      - name: Compute the nightly version
        id: version
        run: |
          base=$(python -c "import re, tomllib; v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; print(re.match(r'\d+\.\d+\.\d+', v).group())")
          if curl -fsS -o /dev/null "https://pypi.org/pypi/auth-ai/${base}/json"; then
            base=$(python -c "a, b, c = '${base}'.split('.'); print(f'{a}.{b}.{int(c) + 1}')")
          fi
          nightly="${base}.dev$(date -u +%Y%m%d%H%M)"
          sed -i -E "0,/^version = \".*\"/s//version = \"${nightly}\"/" pyproject.toml
          grep -n '^version = ' pyproject.toml
          echo "value=$nightly" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the nightly to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/auth-ai
    permissions:
      # OIDC token for PyPI Trusted Publishing: no long-lived PyPI token is used.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
